name: keygen-android
on:
  push:
    branches: [main]
    paths: ["keygen-android/**", ".github/workflows/keygen-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: build the APK
        run: gradle -p keygen-android assembleRelease --no-daemon
      - name: rename
        run: cp keygen-android/app/build/outputs/apk/release/app-release.apk DFD-Codigos.apk
      - uses: actions/upload-artifact@v4
        with: { name: DFD-Codigos-apk, path: DFD-Codigos.apk }
      - name: "publish: the private release 'keygen'"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view keygen >/dev/null 2>&1 || gh release create keygen --title "DFD Codigos (Android, private: holds the key)" --notes "The code generator. Never share this APK."
          gh release upload keygen DFD-Codigos.apk --clobber
