<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DFD Códigos · Polaris Sound Lab</title>
<style>
:root{--ink:#0e0c0b;--ink2:#181412;--ink3:#231c19;--bone:#ebe2cd;--bone2:#bdb39d;--dim:#857b6a;--line:#3a312b;--ember:#ff4a1c;--cold:#2fb8ff;--ok:#7fe0ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--bone);font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px;padding:18px 16px 40px;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 15% 0%,rgba(255,74,28,.16),transparent 55%),radial-gradient(ellipse at 85% 0%,rgba(47,184,255,.14),transparent 55%);pointer-events:none;z-index:-1}
.wrap{max-width:560px;margin:0 auto}
.split{background:linear-gradient(90deg,var(--ember),#ffd2b8 45%,#fff4e6 50%,#bff3ff 55%,var(--cold));-webkit-background-clip:text;background-clip:text;color:transparent}
header{text-align:center;margin:6px 0 20px}
header svg{width:74px;height:74px;display:block;margin:0 auto 6px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:24px;letter-spacing:.14em;font-weight:700}
.sub{font-size:13px;letter-spacing:.32em;color:var(--bone2);text-transform:uppercase;margin-top:4px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--ember),#fff4e6,var(--cold))}
label{display:block;font-size:13px;letter-spacing:.24em;color:var(--bone2);text-transform:uppercase;margin:4px 0 8px}
input{width:100%;font:inherit;font-size:20px;background:var(--ink);color:var(--bone);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}
input:focus{border-color:var(--ember)}
button{font:inherit;font-weight:700;letter-spacing:.08em;border:1px solid var(--line);background:var(--ink3);color:var(--bone);border-radius:12px;padding:13px 14px;width:100%;cursor:pointer;font-size:17px}
button:active{transform:scale(.98)}
.big{margin-top:12px;font-size:20px;border:none;color:#140f0d;background:linear-gradient(90deg,#ff4a1c,#ff8a66 40%,#fff4e6 50%,#7fe0ff 60%,#2fb8ff);box-shadow:0 8px 30px rgba(255,120,80,.2),0 8px 30px rgba(47,184,255,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.code{font-family:"Roboto Mono",ui-monospace,Menlo,monospace;font-size:15px;line-height:1.5;word-break:break-all;background:var(--ink);border:1px dashed var(--line);border-radius:12px;padding:12px;color:var(--ok);user-select:all}
.for{font-size:15px;color:var(--bone2);margin-bottom:8px}
.ok{color:var(--ok);font-size:15px;margin-top:8px}
.err{color:var(--ember);font-size:15px;margin-top:8px}
#out{display:none}
.msg{white-space:pre-wrap;font-size:15px;color:var(--bone2);background:var(--ink);border-radius:12px;padding:12px;max-height:220px;overflow:auto;border:1px solid var(--line)}
.hist{list-style:none}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.hist li:last-child{border:none}
.hist small{color:var(--dim)}
.hist button{width:auto;padding:6px 10px;font-size:13px}
.empty{color:var(--dim);font-size:15px}
footer{text-align:center;color:var(--dim);font-size:13px;letter-spacing:.12em;margin-top:22px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--bone);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:700;transition:transform .25s}
.toast.s{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <svg viewBox="-60 -60 120 120"><defs><linearGradient id="g" x1="-60" x2="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff4a1c"/><stop offset=".5" stop-color="#fff4e6"/><stop offset="1" stop-color="#2fb8ff"/></linearGradient></defs>
  <g fill="none" stroke="url(#g)" stroke-width="3"><circle r="54" stroke-dasharray="9 6"/><path d="M0,-46 L40,24 L-40,24 Z" stroke-linejoin="round"/><path d="M-30,0 Q0,-22 30,0 Q0,22 -30,0 Z"/><circle r="9"/></g><circle r="4" fill="#fff4e6"/></svg>
  <h1 class="split">DFD CÓDIGOS</h1>
  <div class="sub">Dark Funk Durcal Synt · Polaris Sound Lab</div>
</header>

<div class="card">
  <label for="em">Correo de quien pagó</label>
  <input id="em" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="cliente@correo.com">
  <button class="big" id="gen">GENERAR CÓDIGO</button>
  <div id="err" class="err"></div>
</div>

<div class="card" id="out">
  <label>Código de activación</label>
  <div class="for" id="for"></div>
  <div class="code" id="code"></div>
  <div class="ok" id="ver"></div>
  <div class="row"><button id="cpCode">COPIAR CÓDIGO</button><button id="cpMsg">COPIAR MENSAJE</button></div>
  <div class="row"><button id="mail">✉ ENVIAR CORREO</button><button id="share">↗ COMPARTIR</button></div>
  <label style="margin-top:14px">Mensaje de agradecimiento</label>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <label>Historial (solo en este teléfono)</label>
  <ul class="hist" id="hist"></ul>
</div>

<footer>POLARIS SOUND LAB · MÉRIDA, YUCATÁN, MÉXICO<br>Esta app guarda la llave privada: no la compartas.</footer>
</div>
<div class="toast" id="toast"></div>

<script>
// ---- the private key (keep this app to yourself): N, d; the plugin only knows N and e = 65537
const N = BigInt("0xd34ac302d88d8298a6c46a95101eb787dc5c7a69eb1b0112fc1a4d9eae33dc872006b141afefbaa4f20322e45f9908d122d129900bcb15557448bc5e9a2aebea34efaa87b3290761"), D = BigInt("0x83d8900db391c21f7d58ed652cd4ee13622776dfa72c87a4101a5dbb19db14ce60e6ac2e3c8abb4c999089f7fbb38016dfcaf05ad16c83cf984573f5391962ad4a742a77a3cae76d"), E = 65537n;
const A32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const SITE = "https://drophlex.github.io/dark-funk-durcal-synt-fm1/";

// ---- SHA-256 (plain JS, works offline everywhere)
function sha256(bytes){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l=bytes.length,bl=((l+9+63)>>6)<<6,m=new Uint8Array(bl);m.set(bytes);m[l]=0x80;
  const bits=l*8;for(let i=0;i<8;i++)m[bl-1-i]=Math.floor(bits/Math.pow(2,8*i))&255;
  const w=new Uint32Array(64),r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<bl;o+=64){
    for(let i=0;i<16;i++)w[i]=(m[o+4*i]<<24)|(m[o+4*i+1]<<16)|(m[o+4*i+2]<<8)|m[o+4*i+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    H=[H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x|0);
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
const norm=e=>e.trim().toLowerCase();
const hashOf=e=>BigInt('0x'+sha256(new TextEncoder().encode('DFDS2|'+norm(e))));
function modpow(b,e,m){let r=1n;b%=m;while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n}return r}
function makeCode(email){
  const s=modpow(hashOf(email),D,N);
  const digits=Math.ceil(N.toString(2).length/5);let out='';
  for(let i=digits-1;i>=0;i--)out+=A32[Number((s>>BigInt(5*i))&31n)];
  if(modpow(s,E,N)!==hashOf(email))throw new Error('verify');
  return 'DFD2-'+out.match(/.{1,8}/g).join('-');
}
function message(email,code){
  return `¡Hola!

¡Muchas gracias por tu compra de Dark Funk Durcal Synt! Tu apoyo hace posible que sigamos creando instrumentos oscuros en Polaris Sound Lab.

Tu código de activación (para ${norm(email)}):

${code}

Cómo activarlo:
1. Abre el plugin (o la app) y pulsa DESBLOQUEAR.
2. Escribe tu correo exactamente así: ${norm(email)}
3. Pega el código y pulsa ACTIVAR / ACTIVATE.
Es tuyo para siempre, en todas tus computadoras.

No olvides revisar los demás plugins de Dark Funk Durcal creados en Polaris Sound Lab:
${SITE}
Instagram: @polaris.sound.lab · YouTube: @PolarisSoundLab

¿Qué es Dark Funk Durcal? Búscalo en Spotify, YouTube y todas las plataformas de audio.

— Polaris Sound Lab · Mérida, Yucatán, México

---
Thank you for buying Dark Funk Durcal Synt! Your activation code is above: press UNLOCK in the plugin, type your e-mail (${norm(email)}), paste the code and press ACTIVATE. And don't forget to check out the other Dark Funk Durcal plugins made at Polaris Sound Lab: ${SITE}`;
}
const SUBJ='Tu código de Dark Funk Durcal Synt · Gracias por tu compra';

// ---- the phone (Android app) or the browser
const AND=window.Android;
function copy(t){if(AND&&AND.copy){AND.copy(t)}else if(navigator.clipboard){navigator.clipboard.writeText(t).catch(()=>{})}toast('Copiado')}
function share(t){if(AND&&AND.share)AND.share(SUBJ,t);else if(navigator.share)navigator.share({title:SUBJ,text:t}).catch(()=>{});else copy(t)}
function mail(to,t){if(AND&&AND.email)AND.email(to,SUBJ,t);else location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(SUBJ)+'&body='+encodeURIComponent(t)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('s'),1400)}

// ---- the history
function hist(){try{return JSON.parse(localStorage.getItem('dfd_hist')||'[]')}catch(e){return[]}}
function save(h){try{localStorage.setItem('dfd_hist',JSON.stringify(h.slice(0,300)))}catch(e){}}
function renderHist(){
  const ul=document.getElementById('hist'),h=hist();ul.innerHTML='';
  if(!h.length){ul.innerHTML='<li class="empty">Aún no hay códigos.</li>';return}
  h.forEach(x=>{const li=document.createElement('li');const d=new Date(x.t);
    li.innerHTML=`<span>${x.e}<br><small>${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></span>`;
    const b=document.createElement('button');b.textContent='ABRIR';b.onclick=()=>{document.getElementById('em').value=x.e;gen()};li.appendChild(b);ul.appendChild(li)});
}

let cur=null;
function gen(){
  const em=document.getElementById('em').value,err=document.getElementById('err');err.textContent='';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(norm(em))){err.textContent='Escribe un correo válido.';return}
  let code;try{code=makeCode(em)}catch(e){err.textContent='No se pudo generar (error de la llave).';return}
  cur={email:norm(em),code,msg:message(em,code)};
  document.getElementById('for').textContent='Para: '+cur.email;
  document.getElementById('code').textContent=code;
  document.getElementById('ver').textContent='✓ Verificado: este código abre el plugin con ese correo.';
  document.getElementById('msg').textContent=cur.msg;
  document.getElementById('out').style.display='block';
  const h=hist().filter(x=>x.e!==cur.email);h.unshift({e:cur.email,t:Date.now()});save(h);renderHist();
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
}
document.getElementById('gen').onclick=gen;
document.getElementById('em').addEventListener('keydown',e=>{if(e.key==='Enter')gen()});
document.getElementById('cpCode').onclick=()=>cur&&copy(cur.code);
document.getElementById('cpMsg').onclick=()=>cur&&copy(cur.msg);
document.getElementById('mail').onclick=()=>cur&&mail(cur.email,cur.msg);
document.getElementById('share').onclick=()=>cur&&share(cur.msg);
renderHist();
</script>
</body>
</html>
